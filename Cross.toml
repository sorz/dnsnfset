[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
env = { passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
    "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=/usr/aarch64-linux-gnu -I/usr/include"
]}
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes curl unzip libmnl-dev:arm64 libnftables-dev:arm64",
    "PROTOC_ARCH=$(uname -m | sed 's/aarch64/aarch_64/') && curl -sSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-${PROTOC_ARCH}.zip -o /tmp/protoc.zip && unzip -q /tmp/protoc.zip -d /usr/local && rm /tmp/protoc.zip"
]
