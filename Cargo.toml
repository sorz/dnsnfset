[package]
name = "dnsnfset"
version = "0.2.0"
authors = ["sorz <me@sorz.org>"]
edition = "2021"

[dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"
clap = "4"
mnl = "0.3"
protobuf = "4.36.1-release"
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
fundu = "2"
serde_json = "1"
compact_str = { version = "0.10", features = ["serde"] }
simple-dns = "0.12"
signal-hook = "0.3"
sd-notify = "0.5"
byteorder = "1"

[build-dependencies]
bindgen = "0.72"
protobuf-codegen = "4.36.1-release"
